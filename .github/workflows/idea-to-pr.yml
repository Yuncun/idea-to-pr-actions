# Idea to PR: an idea becomes a brief, a person approves it, then an issue and a pull request are opened.
# The brief and build jobs are stand-ins: no agent runs; they show the flow's shape.
name: Idea to PR
run-name: "Idea to PR: ${{ inputs.idea }}"

on:
  workflow_dispatch:
    inputs:
      idea:
        description: The idea, in a sentence or two
        required: true
        type: string

permissions: {}

jobs:
  brief:
    name: Write the brief
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      title: ${{ steps.write.outputs.title }}
    steps:
      - uses: actions/checkout@v7
      - name: Write the brief
        id: write
        env:
          IDEA: ${{ inputs.idea }}
        run: |
          # Stand-in: an agent would read the repository and write this brief.
          title=$(printf '%s' "$IDEA" | head -n1 | cut -c1-70)
          {
            echo "$title"
            echo
            echo "## Idea"
            echo
            echo "$IDEA"
            echo
            echo "## Change"
            echo
            echo "_Stand-in: an agent would read the repository and describe the change and the files to touch here._"
            echo
            echo "## Test"
            echo
            echo "npm test"
          } > brief.md
          echo "title=$title" >> "$GITHUB_OUTPUT"
          { echo "## Brief"; echo; tail -n +3 brief.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: brief
          path: brief.md

  approve:
    name: Approve the brief
    needs: brief
    runs-on: ubuntu-latest
    environment: approve-brief
    steps:
      - run: echo "Brief approved."

  build:
    name: Open the issue and pull request
    needs: [brief, approve]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: brief
          path: ${{ runner.temp }}/brief
      - name: Open the issue and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.brief.outputs.title }}
          BRIEF: ${{ runner.temp }}/brief/brief.md
        run: |
          issue=$(gh issue create --title "$TITLE" --body "$(tail -n +3 "$BRIEF")")
          number=${issue##*/}
          git switch -c "idea/$number"
          mkdir -p briefs && tail -n +3 "$BRIEF" > "briefs/$number.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs && git commit -m "docs: add the brief for #$number"
          git push origin "idea/$number"
          pr=$(gh pr create --head "idea/$number" --title "$TITLE" \
            --body "Closes #$number. Stand-in: a coding agent would make the change here; this pull request only adds the brief.")
          { echo "## Opened"; echo; echo "- Issue: $issue"; echo "- Pull request: $pr"; } >> "$GITHUB_STEP_SUMMARY"
